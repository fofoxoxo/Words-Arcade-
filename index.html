<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordArcade - Minimal Dictionary & Exam Prep</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #111111;
            --border: #cccccc;
            --subtext: #555555;
            --card-bg: #f9f9f9;
        }

        [data-theme="dark"] {
            --bg: #121212;
            --text: #e0e0e0;
            --border: #333333;
            --subtext: #aaaaaa;
            --card-bg: #1e1e1e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 15px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--text);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px; }

        .theme-toggle {
            background: none;
            border: 1px solid var(--text);
            color: var(--text);
            padding: 4px 10px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        nav {
            display: flex;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--subtext);
            padding: 8px 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .nav-btn.active {
            color: var(--text);
            border-bottom: 2px solid var(--text);
        }

        .page { display: none; }
        .page.active { display: block; }

        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--text);
            background: var(--bg);
            color: var(--text);
            font-size: 1rem;
            outline: none;
        }

        button.action-btn {
            padding: 10px 20px;
            background: var(--text);
            color: var(--bg);
            border: 1px solid var(--text);
            font-weight: 600;
            cursor: pointer;
        }

        .phonetic-text {
            font-family: monospace;
            color: var(--subtext);
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .category-block {
            border: 1px solid var(--border);
            padding: 15px;
            margin-bottom: 15px;
            background: var(--card-bg);
        }

        .category-title {
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 4px;
            margin-bottom: 10px;
        }

        .tag {
            display: inline-block;
            border: 1px solid var(--text);
            padding: 2px 8px;
            font-size: 0.8rem;
            margin: 3px;
        }

        .game-bar {
            width: 100%;
            padding: 15px;
            border: 1px solid var(--text);
            background: var(--card-bg);
            color: var(--text);
            text-align: left;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .game-container {
            display: none;
            border: 1px solid var(--text);
            padding: 15px;
            margin-top: 15px;
            background: var(--card-bg);
        }

        .letter-tile {
            display: inline-block;
            border: 1px solid var(--text);
            padding: 8px 14px;
            font-size: 1.2rem;
            font-weight: bold;
            margin: 4px;
            background: var(--bg);
        }

        .option-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid var(--text);
            background: var(--bg);
            color: var(--text);
            font-size: 1rem;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
        }

        .option-btn:hover {
            background: var(--border);
        }
    </style>
</head>
<body>

    <header>
        <h1>WordArcade</h1>
        <button class="theme-toggle" onclick="toggleTheme()">Theme: Dark/Light</button>
    </header>

    <nav>
        <button class="nav-btn active" onclick="switchPage('search-page', this)">Search Word</button>
        <button class="nav-btn" onclick="switchPage('games-page', this)">Arcade Games</button>
    </nav>

    <!-- PAGE 1: DICTIONARY SEARCH -->
    <div id="search-page" class="page active">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search word (e.g. resilient, fragile)...">
            <button class="action-btn" onclick="searchWord()">Search</button>
        </div>

        <div id="resultOutput"></div>
    </div>

    <!-- PAGE 2: GAMES SELECTION -->
    <div id="games-page" class="page">
        <div class="game-bar" onclick="startAnagramGame()">
            <span>1. Anagram Scramble (Definition Clue)</span>
            <span>&rarr;</span>
        </div>
        <div class="game-bar" onclick="startSynonymGame()">
            <span>2. Synonyms Match</span>
            <span>&rarr;</span>
        </div>
        <div class="game-bar" onclick="startAntonymGame()">
            <span>3. Antonyms Challenge</span>
            <span>&rarr;</span>
        </div>
        <div class="game-bar" onclick="startFillBlankGame()">
            <span>4. Fill in the Blanks</span>
            <span>&rarr;</span>
        </div>

        <!-- Universal Game Arena Container -->
        <div id="gameArena" class="game-container">
            <button class="action-btn" style="float: right;" onclick="closeGame()">Close Game</button>
            <h2 id="gameTitle" style="margin-bottom: 10px;">Game Arena</h2>
            
            <div class="category-block">
                <div id="gameClueHeader" class="category-title">Clue</div>
                <p id="gameClueText">Search words on Search Page to populate game data!</p>
                <p id="gameSubClue" class="phonetic-text" style="margin-top:5px;"></p>
            </div>

            <!-- Custom Controls based on Active Game -->
            <div id="gameDynamicContent"></div>

            <p id="gameFeedback" style="font-weight: bold; margin-top: 10px;"></p>
        </div>
    </div>

    <script>
        let currentWordData = null;
        // Default Seed Words Data taaki bina initial search ke bhi games active banein
        const defaultSeedWords = [
            {
                word: "resilient",
                phonetic: "/rɪˈzɪl.jənt/",
                meanings: [{
                    partOfSpeech: "adjective",
                    definitions: [{ definition: "Able to withstand or recover quickly from difficult conditions.", example: "He showed a resilient attitude." }],
                    synonyms: ["tough", "adaptable", "hardy"],
                    antonyms: ["fragile", "vulnerable"]
                }]
            },
            {
                word: "fragile",
                phonetic: "/ˈfrædʒ.aɪl/",
                meanings: [{
                    partOfSpeech: "adjective",
                    definitions: [{ definition: "Easily broken or damaged.", example: "Handle the fragile package with care." }],
                    synonyms: ["delicate", "brittle"],
                    antonyms: ["strong", "robust"]
                }]
            }
        ];

        let savedWords = JSON.parse(localStorage.getItem('wordarcade_saved_words') || JSON.stringify(defaultSeedWords));

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
        }

        function switchPage(pageId, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            btn.classList.add('active');
        }

        async function searchWord(query = null) {
            const word = query || document.getElementById('searchInput').value.trim();
            if (!word) return;

            const output = document.getElementById('resultOutput');
            output.innerHTML = "<p>Searching dictionary...</p>";

            try {
                const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
                if (!res.ok) throw new Error("Word not found");
                const data = await res.json();
                
                currentWordData = data[0];
                saveToLocalStorage(currentWordData);
                renderDictionaryOutput(currentWordData);

            } catch (err) {
                output.innerHTML = `<p style="color:red;">No entry found for "${word}". Try another word.</p>`;
            }
        }

        function saveToLocalStorage(data) {
            if (!savedWords.some(w => w.word.toLowerCase() === data.word.toLowerCase())) {
                savedWords.push(data);
                localStorage.setItem('wordarcade_saved_words', JSON.stringify(savedWords));
            }
        }

        function renderDictionaryOutput(data) {
            const phonetic = data.phonetic || (data.phonetics && data.phonetics.find(p => p.text)?.text) || "N/A";
            
            let html = `
                <h2 style="font-size: 2rem;">${data.word}</h2>
                <div class="phonetic-text">Text Pronunciation: ${phonetic}</div>
            `;

            data.meanings.forEach(m => {
                const synonyms = m.synonyms.length ? m.synonyms.map(s => `<span class="tag">${s}</span>`).join('') : "None";
                const antonyms = m.antonyms.length ? m.antonyms.map(a => `<span class="tag">${a}</span>`).join('') : "None";

                html += `
                    <div class="category-block">
                        <div class="category-title">Grammatical Identity: ${m.partOfSpeech}</div>
                        <p><strong>Definition:</strong> ${m.definitions[0].definition}</p>
                        ${m.definitions[0].example ? `<p><strong>Example:</strong> "<em>${m.definitions[0].example}</em>"</p>` : ''}
                        
                        <div style="margin-top: 10px;">
                            <strong>Synonyms:</strong> ${synonyms}
                        </div>
                        <div style="margin-top: 5px;">
                            <strong>Antonyms / Thesaurus:</strong> ${antonyms}
                        </div>
                    </div>
                `;
            });

            document.getElementById('resultOutput').innerHTML = html;
        }

        function getActiveWordData() {
            return currentWordData || savedWords[Math.floor(Math.random() * savedWords.length)];
        }

        // --- GAME 1: ANAGRAM SCRAMBLE ---
        function startAnagramGame() {
            const activeData = getActiveWordData();
            document.getElementById('gameArena').style.display = 'block';
            document.getElementById('gameTitle').innerText = "Anagram Scramble";
            document.getElementById('gameClueHeader').innerText = "Definition Clue";

            const target = activeData.word.toUpperCase();
            const def = activeData.meanings[0].definitions[0].definition;
            const phon = activeData.phonetic || (activeData.phonetics && activeData.phonetics[0]?.text) || "";

            document.getElementById('gameClueText').innerText = def;
            document.getElementById('gameSubClue').innerText = `Pronunciation: ${phon}`;

            let shuffled = target.split('').sort(() => Math.random() - 0.5).join('');
            let tilesHtml = shuffled.split('').map(l => `<span class="letter-tile">${l}</span>`).join('');

            document.getElementById('gameDynamicContent').innerHTML = `
                <div style="margin-bottom: 15px;">
                    <p style="font-size: 0.9rem; font-weight: 600;">Scrambled Letters:</p>
                    <div>${tilesHtml}</div>
                </div>
                <div class="search-box">
                    <input type="text" id="gameInput" placeholder="Type formed word...">
                    <button class="action-btn" onclick="checkAnagramAnswer('${target}')">Submit</button>
                </div>
            `;
            document.getElementById('gameFeedback').innerText = "";
        }

        function checkAnagramAnswer(correct) {
            const ans = document.getElementById('gameInput').value.trim().toUpperCase();
            const feedback = document.getElementById('gameFeedback');
            if (ans === correct) {
                feedback.style.color = "green";
                feedback.innerText = "✓ Correct Word Solved!";
            } else {
                feedback.style.color = "red";
                feedback.innerText = "✗ Incorrect! Try again.";
            }
        }

        // --- GAME 2: SYNONYMS MATCH ---
        function startSynonymGame() {
            document.getElementById('gameArena').style.display = 'block';
            document.getElementById('gameTitle').innerText = "Synonyms Match";

            const validWords = savedWords.filter(w => w.meanings.some(m => m.synonyms && m.synonyms.length > 0));
            if (!validWords.length) {
                document.getElementById('gameClueText').innerText = "Search words like 'resilient' or 'fragile' to generate synonym challenges!";
                return;
            }

            const activeData = validWords[Math.floor(Math.random() * validWords.length)];
            const targetWord = activeData.word.toUpperCase();
            const meaningObj = activeData.meanings.find(m => m.synonyms.length > 0);
            const correctSynonym = meaningObj.synonyms[0];

            document.getElementById('gameClueHeader').innerText = "Target Word";
            document.getElementById('gameClueText').innerText = `Find Synonym for: ${targetWord}`;
            document.getElementById('gameSubClue').innerText = `Part of Speech: ${meaningObj.partOfSpeech}`;

            let distractors = ["obvious", "rapid", "silent", "obscure", "vivid", "dense"];
            let options = [correctSynonym, ...distractors.sort(() => Math.random() - 0.5).slice(0, 3)];
            options.sort(() => Math.random() - 0.5);

            let optionsHtml = options.map(opt => `
                <button class="option-btn" onclick="checkOptionAnswer('${opt}', '${correctSynonym}')">${opt}</button>
            `).join('');

            document.getElementById('gameDynamicContent').innerHTML = optionsHtml;
            document.getElementById('gameFeedback').innerText = "";
        }

        // --- GAME 3: ANTONYMS CHALLENGE ---
        function startAntonymGame() {
            document.getElementById('gameArena').style.display = 'block';
            document.getElementById('gameTitle').innerText = "Antonyms Challenge";

            const validWords = savedWords.filter(w => w.meanings.some(m => m.antonyms && m.antonyms.length > 0));
            if (!validWords.length) {
                document.getElementById('gameClueText').innerText = "Search words with antonyms (e.g., 'fragile') to activate this mode!";
                return;
            }

            const activeData = validWords[Math.floor(Math.random() * validWords.length)];
            const targetWord = activeData.word.toUpperCase();
            const meaningObj = activeData.meanings.find(m => m.antonyms.length > 0);
            const correctAntonym = meaningObj.antonyms[0];

            document.getElementById('gameClueHeader').innerText = "Target Word";
            document.getElementById('gameClueText').innerText = `Find Opposite (Antonym) for: ${targetWord}`;
            document.getElementById('gameSubClue').innerText = `Part of Speech: ${meaningObj.partOfSpeech}`;

            let distractors = ["gentle", "complex", "frequent", "narrow", "vague"];
            let options = [correctAntonym, ...distractors.sort(() => Math.random() - 0.5).slice(0, 3)];
            options.sort(() => Math.random() - 0.5);

            let optionsHtml = options.map(opt => `
                <button class="option-btn" onclick="checkOptionAnswer('${opt}', '${correctAntonym}')">${opt}</button>
            `).join('');

            document.getElementById('gameDynamicContent').innerHTML = optionsHtml;
            document.getElementById('gameFeedback').innerText = "";
        }

        // --- GAME 4: FILL IN THE BLANKS ---
        function startFillBlankGame() {
            document.getElementById('gameArena').style.display = 'block';
            document.getElementById('gameTitle').innerText = "Fill in the Blanks";

            const validWords = savedWords.filter(w => w.meanings.some(m => m.definitions.some(d => d.example)));
            if (!validWords.length) {
                document.getElementById('gameClueText').innerText = "Search words that contain example sentences to unlock Cloze Test!";
                return;
            }

            const activeData = validWords[Math.floor(Math.random() * validWords.length)];
            const targetWord = activeData.word;
            let exampleSentence = "";

            activeData.meanings.forEach(m => {
                m.definitions.forEach(d => {
                    if (d.example && !exampleSentence) exampleSentence = d.example;
                });
            });

            // Replace word in sentence with blank
            const regex = new RegExp(targetWord, "gi");
            const maskedSentence = exampleSentence.replace(regex, "________");

            document.getElementById('gameClueHeader').innerText = "Sentence Context";
            document.getElementById('gameClueText').innerText = `"${maskedSentence}"`;
            document.getElementById('gameSubClue').innerText = "Choose the correct word that fits the sentence context.";

            let distractors = ["resilient", "fragile", "dynamic", "silent", "obscure"];
            let options = [targetWord, ...distractors.filter(d => d !== targetWord).slice(0, 3)];
            options.sort(() => Math.random() - 0.5);

            let optionsHtml = options.map(opt => `
                <button class="option-btn" onclick="checkOptionAnswer('${opt}', '${targetWord}')">${opt}</button>
            `).join('');

            document.getElementById('gameDynamicContent').innerHTML = optionsHtml;
            document.getElementById('gameFeedback').innerText = "";
        }

        function checkOptionAnswer(selected, correct) {
            const feedback = document.getElementById('gameFeedback');
            if (selected.toLowerCase() === correct.toLowerCase()) {
                feedback.style.color = "green";
                feedback.innerText = "✓ Correct Answer!";
            } else {
                feedback.style.color = "red";
                feedback.innerText = `✗ Incorrect. Correct answer was: ${correct}`;
            }
        }

        function closeGame() {
            document.getElementById('gameArena').style.display = 'none';
        }
    </script>
</body>
</html>
