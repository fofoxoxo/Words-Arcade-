<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WordArcade</title>
<style>
:root{
  --bg:#ffffff; --fg:#111111; --muted:#555555; --line:#cccccc; --soft:#f9f9f9; --hover:#eaeaea;
  --serif:"Linux Libertine",Georgia,Times,"Times New Roman",serif;
  --sans:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
[data-theme="dark"]{
  --bg:#181818; --fg:#e0e0e0; --muted:#bbbbbb; --line:#333333; --soft:#1b1b1b; --hover:#2a2a2a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:2px solid var(--line)}
header h1{margin:0;font-family:var(--serif);font-weight:normal;font-size:1.7rem;letter-spacing:.2px}
header h1 span{font-size:.8rem;color:var(--muted);font-family:var(--sans);margin-left:8px}
button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:0;cursor:pointer;padding:8px 14px}
button:hover:not(:disabled){background:var(--hover)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
a{color:var(--fg)}
#themeBtn{padding:6px 12px;font-size:.9rem}
nav{display:flex;border-bottom:1px solid var(--line)}
nav button{flex:1;border:0;border-right:1px solid var(--line);padding:12px;font-weight:bold}
nav button:last-child{border-right:0}
nav button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
main{max-width:820px;margin:0 auto;padding:18px 16px 60px}
.search{display:flex;gap:0;margin-bottom:18px}
.search input{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);border-right:0;background:var(--bg);color:var(--fg);border-radius:0}
h2{font-family:var(--serif);font-weight:normal;font-size:1.45rem;border-bottom:1px solid var(--line);padding-bottom:3px;margin:26px 0 10px}
h3{font-size:1rem;margin:14px 0 4px;font-style:italic}
.title{font-family:var(--serif);font-size:2.1rem;margin:0 0 4px;border-bottom:2px solid var(--line);padding-bottom:4px}
.src{font-size:.8rem;color:var(--muted);margin:4px 0 0}
ol,ul{margin:6px 0 6px 1.3rem;padding:0}
li{margin:4px 0}
.ex{font-style:italic;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:3px 10px;font-size:.9rem}
.box{border:1px solid var(--line);background:var(--soft);padding:12px 14px;margin-top:6px}
.msg{border:1px solid var(--line);padding:14px;background:var(--soft)}
.diag{font-size:.8rem;color:var(--muted);margin-top:10px}
.row{display:flex;width:100%;align-items:center;gap:14px;text-align:left;padding:16px;border:1px solid var(--line);border-bottom:0;background:var(--bg)}
.row:last-of-type{border-bottom:1px solid var(--line)}
.row .n{font-family:var(--serif);font-size:1.5rem;width:1.6rem}
.row b{display:block;font-size:1.05rem}
.row small{color:var(--muted)}
.gh{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--line);padding-bottom:8px;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.gh h2{margin:0;border:0;padding:0}
.score{font-size:.9rem}
.q{font-family:var(--serif);font-size:1.6rem;margin:10px 0 4px}
.scr{font-family:monospace;font-size:2rem;letter-spacing:.4rem;margin:10px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.opts button{padding:12px}
.opts button.right{background:var(--fg);color:var(--bg);font-weight:bold}
.opts button.wrong{text-decoration:line-through;opacity:.6}
.fb{min-height:1.6em;margin:8px 0;font-weight:bold}
.inline{display:flex;gap:8px;margin:10px 0}
.inline input{flex:1;min-width:0;font:inherit;padding:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:0}
.hidden{display:none}
@media(max-width:480px){.opts{grid-template-columns:1fr}.title{font-size:1.7rem}}
</style>
</head>
<body>
<header>
  <h1>WordArcade<span>The free word game</span></h1>
  <button id="themeBtn" type="button" aria-label="Toggle dark mode">Dark mode</button>
</header>
<nav role="tablist">
  <button role="tab" id="tabSearch" aria-selected="true" type="button">Word Search</button>
  <button role="tab" id="tabGames" aria-selected="false" type="button">Arcade Games</button>
</nav>
<main>
  <section id="viewSearch">
    <div class="search">
      <input id="q" type="search" placeholder="Search a word, e.g. panther" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search word">
      <button id="goBtn" type="button">Search</button>
    </div>
    <div id="result"><div class="msg">Enter a word above to see its pronunciation, definitions, examples and thesaurus entries. Try <a href="#" data-w="panther">panther</a>, <a href="#" data-w="resilient">resilient</a> or <a href="#" data-w="dynamic">dynamic</a>.</div></div>
  </section>
  <section id="viewGames" class="hidden">
    <div id="gameList">
      <h2 style="margin-top:0">Arcade Games</h2>
      <button class="row" data-g="anagram" type="button"><span class="n">1</span><span><b>Anagram Scramble</b><small>Unscramble the letters to find the word.</small></span></button>
      <button class="row" data-g="syn" type="button"><span class="n">2</span><span><b>Synonyms Match</b><small>Pick the word with the same meaning.</small></span></button>
      <button class="row" data-g="ant" type="button"><span class="n">3</span><span><b>Antonyms Challenge</b><small>Pick the word with the opposite meaning.</small></span></button>
      <button class="row" data-g="fill" type="button"><span class="n">4</span><span><b>Fill in the Blanks</b><small>Complete the sentence with the right word.</small></span></button>
    </div>
    <div id="gameBox" class="hidden"></div>
  </section>
</main>

<script>
"use strict";
/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const uniq = a => [...new Set(a.filter(Boolean))];

/* ---------- Theme ---------- */
const root = document.documentElement;
function setTheme(t) {
  root.setAttribute("data-theme", t);
  $("#themeBtn").textContent = t === "dark" ? "Light mode" : "Dark mode";
  try { localStorage.setItem("wa-theme", t); } catch (e) {}
}
(function initTheme() {
  let t = null;
  try { t = localStorage.getItem("wa-theme"); } catch (e) {}
  if (!t) t = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  setTheme(t);
})();
$("#themeBtn").addEventListener("click", () => setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark"));

/* ---------- Tabs ---------- */
function showTab(which) {
  const s = which === "search";
  $("#viewSearch").classList.toggle("hidden", !s);
  $("#viewGames").classList.toggle("hidden", s);
  $("#tabSearch").setAttribute("aria-selected", s);
  $("#tabGames").setAttribute("aria-selected", !s);
}
$("#tabSearch").addEventListener("click", () => showTab("search"));
$("#tabGames").addEventListener("click", () => showTab("games"));

/* ---------- Local seed dictionary (offline fallback) ----------
   [word, phonetic, pos, definition, example, synonyms, antonyms] */
const RAW = [
 ["hello","/həˈloʊ/","interjection","Used as a greeting or to begin a phone conversation.","Hello, how are you today?",["hi","greetings","hey"],["goodbye","farewell"]],
 ["world","/wɜːrld/","noun","The earth, together with all of its countries and peoples.","She dreams of traveling the world.",["earth","globe","planet"],[]],
 ["resilient","/rɪˈzɪliənt/","adjective","Able to recover quickly from difficulties; tough.","The resilient town rebuilt quickly after the flood.",["tough","flexible","hardy"],["fragile","brittle"]],
 ["fragile","/ˈfrædʒəl/","adjective","Easily broken or damaged.","Pack the fragile glasses carefully.",["delicate","brittle","breakable"],["sturdy","durable"]],
 ["dynamic","/daɪˈnæmɪk/","adjective","Characterized by constant change, activity, or progress.","She leads a dynamic team that adapts fast.",["energetic","vigorous","lively"],["static","inactive"]],
 ["ancient","/ˈeɪnʃənt/","adjective","Belonging to the very distant past.","They explored the ancient ruins at dawn.",["old","archaic","antique"],["modern","new"]],
 ["brave","/breɪv/","adjective","Ready to face danger or pain without showing fear.","The brave firefighter entered the building.",["courageous","bold","fearless"],["cowardly","timid"]],
 ["quiet","/ˈkwaɪət/","adjective","Making little or no noise.","The library was quiet in the morning.",["silent","hushed","still"],["loud","noisy"]],
 ["bright","/braɪt/","adjective","Giving out or reflecting much light; shining.","A bright moon lit the path.",["shining","brilliant","radiant"],["dim","dull"]],
 ["simple","/ˈsɪmpəl/","adjective","Easily understood or done; not complicated.","The instructions were simple to follow.",["easy","plain","basic"],["complex","complicated"]],
 ["rapid","/ˈræpɪd/","adjective","Happening in a short time or at great speed.","The patient made a rapid recovery.",["swift","quick","fast"],["slow","gradual"]],
 ["generous","/ˈdʒɛnərəs/","adjective","Showing readiness to give more than is expected.","He was generous with his time.",["giving","charitable","lavish"],["stingy","selfish"]],
 ["honest","/ˈɒnɪst/","adjective","Free of deceit; truthful and sincere.","She gave an honest answer.",["truthful","sincere","candid"],["dishonest","deceitful"]],
 ["gentle","/ˈdʒɛntəl/","adjective","Mild in temperament or behavior; kind.","Use a gentle touch with the kitten.",["mild","tender","soft"],["harsh","rough"]],
 ["abundant","/əˈbʌndənt/","adjective","Existing in large quantities; plentiful.","The valley has abundant fresh water.",["plentiful","ample","copious"],["scarce","sparse"]],
 ["calm","/kɑːm/","adjective","Not showing nervousness, anger, or other strong emotions.","Stay calm and breathe slowly.",["peaceful","serene","relaxed"],["agitated","anxious"]],
 ["create","/kriˈeɪt/","verb","To bring something into existence.","Artists create work that moves people.",["make","build","produce"],["destroy","demolish"]],
 ["begin","/bɪˈɡɪn/","verb","To start; to perform the first part of an action.","Classes begin at nine o'clock.",["start","commence","launch"],["end","finish"]],
 ["victory","/ˈvɪktəri/","noun","An act of defeating an opponent or enemy.","The team celebrated their victory.",["triumph","win","conquest"],["defeat","loss"]],
 ["journey","/ˈdʒɜːrni/","noun","An act of traveling from one place to another.","The journey took three days by train.",["trip","voyage","trek"],[]],
 ["curious","/ˈkjʊəriəs/","adjective","Eager to know or learn something.","The curious child asked many questions.",["inquisitive","interested","eager"],["indifferent","apathetic"]],
 ["strong","/strɒŋ/","adjective","Having the power to resist force or carry heavy weights.","A strong bridge spans the river.",["powerful","sturdy","robust"],["weak","feeble"]],
 ["happy","/ˈhæpi/","adjective","Feeling or showing pleasure or contentment.","The happy crowd cheered loudly.",["joyful","cheerful","content"],["sad","miserable"]],
 ["silent","/ˈsaɪlənt/","adjective","Not making or accompanied by any sound.","The silent forest felt endless.",["quiet","mute","noiseless"],["noisy","loud"]]
];
const SEED = {};
RAW.forEach(r => { SEED[r[0]] = { word: r[0], phonetic: r[1], meanings: [{ pos: r[2], defs: [{ d: r[3], e: r[4] }] }], syn: r[5], ant: r[6] }; });
const WORDS = Object.keys(SEED);

/* ---------- Network: three independent sources, queried in parallel ---------- */
async function getJSON(url, ms) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms || 8000);
  try {
    const res = await fetch(url, { signal: ctl.signal });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  } catch (e) {
    if (e && e.name === "AbortError") throw new Error("timeout");
    throw e;
  } finally { clearTimeout(t); }
}
function strip(html) {
  try { return (new DOMParser().parseFromString(html || "", "text/html").body.textContent || "").replace(/\s+/g, " ").trim(); }
  catch (e) { return String(html || "").replace(/<[^>]*>/g, "").trim(); }
}
const POS = { n: "noun", v: "verb", adj: "adjective", adv: "adverb", u: "" };

/* Source 1: Free Dictionary API */
async function srcFreeDict(w) {
  const j = await getJSON("https://api.dictionaryapi.dev/api/v2/entries/en/" + encodeURIComponent(w), 8000);
  if (!Array.isArray(j) || !j.length) throw new Error("empty");
  let phonetic = "", syn = [], ant = [];
  const meanings = [];
  j.forEach(entry => {
    if (!phonetic) phonetic = entry.phonetic || ((entry.phonetics || []).find(p => p.text) || {}).text || "";
    (entry.meanings || []).forEach(m => {
      syn = syn.concat(m.synonyms || []); ant = ant.concat(m.antonyms || []);
      const defs = (m.definitions || []).slice(0, 4).map(d => {
        syn = syn.concat(d.synonyms || []); ant = ant.concat(d.antonyms || []);
        return { d: d.definition, e: d.example || "" };
      });
      if (defs.length) meanings.push({ pos: m.partOfSpeech || "", defs });
    });
  });
  if (!meanings.length) throw new Error("no definitions");
  return { phonetic, meanings, syn: uniq(syn), ant: uniq(ant) };
}

/* Source 2: Wiktionary REST API */
async function srcWiktionary(w) {
  const j = await getJSON("https://en.wiktionary.org/api/rest_v1/page/definition/" + encodeURIComponent(w), 8000);
  const meanings = [];
  (j.en || []).forEach(b => {
    const defs = (b.definitions || []).slice(0, 4).map(d => {
      const ex = (d.parsedExamples && d.parsedExamples[0] && d.parsedExamples[0].example) || (d.examples && d.examples[0]) || "";
      return { d: strip(d.definition), e: strip(ex) };
    }).filter(x => x.d);
    if (defs.length) meanings.push({ pos: (b.partOfSpeech || "").toLowerCase(), defs });
  });
  if (!meanings.length) throw new Error("no definitions");
  return { meanings };
}

/* Source 3: Datamuse (thesaurus, related words, definitions, syllables) */
async function srcDatamuse(w) {
  const q = encodeURIComponent(w), base = "https://api.datamuse.com/words?";
  const [s, a, m, d] = await Promise.allSettled([
    getJSON(base + "rel_syn=" + q + "&max=15", 8000),
    getJSON(base + "rel_ant=" + q + "&max=15", 8000),
    getJSON(base + "ml=" + q + "&max=20", 8000),
    getJSON(base + "sp=" + q + "&md=ds&max=1", 8000)
  ]);
  if ([s, a, m, d].every(x => x.status === "rejected")) throw (s.reason || new Error("unreachable"));
  const val = x => x.status === "fulfilled" && Array.isArray(x.value) ? x.value : [];
  const out = { syn: val(s).map(x => x.word), ant: val(a).map(x => x.word), rel: val(m).map(x => x.word), meanings: [], syllables: 0 };
  const hit = val(d).find(x => x.word === w);
  if (hit) {
    out.syllables = hit.numSyllables || 0;
    const byPos = {};
    (hit.defs || []).slice(0, 6).forEach(str => {
      const i = str.indexOf("\t");
      const p = POS[str.slice(0, i)] !== undefined ? POS[str.slice(0, i)] : str.slice(0, i);
      (byPos[p] = byPos[p] || []).push({ d: str.slice(i + 1), e: "" });
    });
    Object.keys(byPos).forEach(p => out.meanings.push({ pos: p, defs: byPos[p] }));
  }
  return out;
}

function reason(r) { return (r.reason && r.reason.message) ? r.reason.message : "failed"; }

async function lookup(w) {
  const [f, wk, dm] = await Promise.allSettled([srcFreeDict(w), srcWiktionary(w), srcDatamuse(w)]);
  const F = f.status === "fulfilled" ? f.value : null;
  const W = wk.status === "fulfilled" ? wk.value : null;
  const D = dm.status === "fulfilled" ? dm.value : null;
  const seed = SEED[w] || null;

  const used = [];
  let meanings = [];
  if (F) { meanings = F.meanings; used.push("Free Dictionary API"); }
  else if (W) { meanings = W.meanings; used.push("Wiktionary"); }
  else if (D && D.meanings.length) { meanings = D.meanings; used.push("Datamuse"); }
  else if (seed) { meanings = seed.meanings; used.push("Local seed dictionary"); }
  if (D && (D.syn.length || D.ant.length || D.rel.length) && !used.includes("Datamuse")) used.push("Datamuse thesaurus");

  const syn = uniq([].concat(F ? F.syn : [], D ? D.syn : [], seed ? seed.syn : [])).filter(x => x !== w).slice(0, 15);
  const ant = uniq([].concat(F ? F.ant : [], D ? D.ant : [], seed ? seed.ant : [])).filter(x => x !== w).slice(0, 15);
  const rel = D ? uniq(D.rel).filter(x => x !== w && !syn.includes(x) && !ant.includes(x)).slice(0, 15) : [];
  let phonetic = (F && F.phonetic) || (seed && seed.phonetic) || "";
  const syllables = D ? D.syllables : 0;

  const status = [
    "Free Dictionary API: " + (f.status === "fulfilled" ? "ok" : reason(f)),
    "Wiktionary: " + (wk.status === "fulfilled" ? "ok" : reason(wk)),
    "Datamuse: " + (dm.status === "fulfilled" ? "ok" : reason(dm))
  ];
  const reached = [f, wk, dm].some(x => x.status === "fulfilled");

  if (!meanings.length) return { found: false, reached, status };
  return { found: true, data: { word: w, phonetic, syllables, meanings, syn, ant, rel }, source: used.join(" + "), status };
}

/* ---------- Word Search ---------- */
function chips(list) {
  return '<div class="chips">' + list.map(x => '<button type="button" class="chip" data-w="' + esc(x) + '">' + esc(x) + '</button>').join("") + "</div>";
}
function render(r) {
  const d = r.data;
  const poss = uniq(d.meanings.map(m => m.pos));
  const examples = [];
  d.meanings.forEach(m => m.defs.forEach(x => { if (x.e) examples.push(x.e); }));
  const ph = [];
  if (d.phonetic) ph.push(esc(d.phonetic));
  if (d.syllables) ph.push(d.syllables + (d.syllables === 1 ? " syllable" : " syllables"));
  let html = '<h1 class="title">' + esc(d.word) + '</h1><p class="src">Source: ' + esc(r.source) + '</p>';
  html += '<h2>Phonetic Pronunciation</h2><p>' + (ph.length ? ph.join(" &middot; ") : "Not available.") + '</p>';
  html += '<h2>Part of Speech / Grammatical Identity</h2><p>' + (poss.length ? poss.map(p => esc(p || "unspecified")).join(", ") : "Not available.") + '</p>';
  html += '<h2>Definitions</h2>';
  d.meanings.forEach(m => {
    html += '<h3>' + esc(m.pos || "definition") + '</h3><ol>' + m.defs.map(x => '<li>' + esc(x.d) + '</li>').join("") + '</ol>';
  });
  html += '<h2>Example Usage</h2>' + (examples.length ? '<ul>' + examples.map(e => '<li class="ex">' + esc(e) + '</li>').join("") + '</ul>' : '<p>No examples available for this word.</p>');
  html += '<h2>Synonyms</h2>' + (d.syn.length ? chips(d.syn) : '<p>None found.</p>');
  html += '<h2>Antonyms / Thesaurus</h2><h3>Antonyms</h3>' + (d.ant.length ? chips(d.ant) : '<p>None found.</p>');
  html += '<h3>Related words</h3>' + (d.rel.length ? chips(d.rel) : '<p>None found.</p>');
  html += '<p class="diag">' + r.status.map(esc).join(" &middot; ") + '</p>';
  $("#result").innerHTML = html;
}
let searchId = 0;
async function search(w) {
  w = (w || "").trim().toLowerCase().replace(/\s+/g, " ");
  if (!w) return;
  $("#q").value = w;
  const id = ++searchId;
  $("#result").innerHTML = '<div class="msg">Searching for “' + esc(w) + '”…</div>';
  let r;
  try { r = await lookup(w); } catch (e) { r = { found: false, reached: false, status: [String(e && e.message || e)] }; }
  if (id !== searchId) return;
  if (r.found) { render(r); return; }
  const diag = '<p class="diag">' + r.status.map(esc).join(" &middot; ") + '</p>';
  if (r.reached) {
    $("#result").innerHTML = '<div class="msg">No entry found for “' + esc(w) + '”. Check the spelling and try again.' + diag + '</div>';
  } else {
    $("#result").innerHTML = '<div class="msg">Could not reach any dictionary service. Check your connection (or browser/WebView network permissions) and try again. Offline words you can search: ' + WORDS.slice(0, 8).map(esc).join(", ") + '.' + diag + '</div>';
  }
}
$("#goBtn").addEventListener("click", () => search($("#q").value));
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") search($("#q").value); });
$("#result").addEventListener("click", e => {
  const el = e.target.closest("[data-w]");
  if (el) { e.preventDefault(); search(el.getAttribute("data-w")); }
});

/* ---------- Games ---------- */
const box = $("#gameBox"), list = $("#gameList");
let score = 0, total = 0, last = "";
const POOL = uniq(WORDS.concat(...RAW.map(r => r[5]), ...RAW.map(r => r[6])));

function shell(title) {
  box.innerHTML = '<div class="gh"><h2>' + esc(title) + '</h2><span class="score" id="score"></span><button type="button" id="backBtn">← All games</button></div><div id="gBody"></div>';
  $("#backBtn").addEventListener("click", closeGame);
  updScore();
}
function updScore() { const s = $("#score"); if (s) s.textContent = "Score: " + score + " / " + total; }
function openGame(id) {
  score = 0; total = 0; last = "";
  list.classList.add("hidden"); box.classList.remove("hidden");
  GAMES[id].start();
}
function closeGame() { box.classList.add("hidden"); list.classList.remove("hidden"); box.innerHTML = ""; }
list.addEventListener("click", e => { const b = e.target.closest("[data-g]"); if (b) openGame(b.getAttribute("data-g")); });
function pickWord(filter) {
  const c = WORDS.filter(w => filter(SEED[w]) && w !== last);
  const w = pick(c.length ? c : WORDS); last = w; return w;
}

function mcq(o) {
  const body = $("#gBody");
  body.innerHTML = '<p class="src">' + esc(o.label) + '</p><div class="q">' + o.question + '</div>' +
    (o.hint ? '<p class="ex">' + esc(o.hint) + '</p>' : "") +
    '<div class="opts">' + o.options.map(x => '<button type="button" data-o="' + esc(x) + '">' + esc(x) + '</button>').join("") + '</div>' +
    '<div class="fb" id="fb"></div><button type="button" id="nextBtn" class="hidden">Next →</button>';
  body.querySelectorAll("[data-o]").forEach(b => b.addEventListener("click", () => {
    const ok = b.getAttribute("data-o") === o.answer;
    total++; if (ok) score++;
    body.querySelectorAll("[data-o]").forEach(x => {
      x.disabled = true;
      if (x.getAttribute("data-o") === o.answer) x.classList.add("right");
      else if (x === b) x.classList.add("wrong");
    });
    $("#fb").textContent = ok ? "Correct!" : "Incorrect. The answer is “" + o.answer + "”.";
    $("#nextBtn").classList.remove("hidden"); $("#nextBtn").focus();
    updScore();
  }));
  $("#nextBtn").addEventListener("click", o.next);
}
function distractors(exclude, n) { return shuffle(POOL.filter(x => !exclude.includes(x))).slice(0, n); }

const GAMES = {
  anagram: {
    start() { shell("Anagram Scramble"); this.next(); },
    next() {
      const w = pickWord(x => x.word.length >= 5);
      let s = w; for (let i = 0; i < 20 && s === w; i++) s = shuffle(w.split("")).join("");
      $("#gBody").innerHTML =
        '<p class="src">Unscramble the letters</p><div class="scr">' + esc(s.toUpperCase()) + '</div>' +
        '<p class="ex">Hint: ' + esc(SEED[w].meanings[0].defs[0].d) + ' (' + w.length + ' letters)</p>' +
        '<div class="inline"><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer"><button type="button" id="chk">Check</button></div>' +
        '<div class="fb" id="fb"></div><button type="button" id="skip">Reveal</button> <button type="button" id="nextBtn" class="hidden">Next →</button>';
      let done = false;
      const finish = ok => {
        done = true; total++; if (ok) score++; updScore();
        $("#ans").disabled = true; $("#chk").disabled = true; $("#skip").classList.add("hidden");
        $("#nextBtn").classList.remove("hidden"); $("#nextBtn").focus();
      };
      const check = () => {
        if (done) return;
        const v = $("#ans").value.trim().toLowerCase();
        if (!v) return;
        if (v === w) { $("#fb").textContent = "Correct!"; finish(true); }
        else $("#fb").textContent = "Not quite. Try again.";
      };
      $("#chk").addEventListener("click", check);
      $("#ans").addEventListener("keydown", e => { if (e.key === "Enter") check(); });
      $("#skip").addEventListener("click", () => { $("#fb").textContent = "The word was “" + w + "”."; finish(false); });
      $("#nextBtn").addEventListener("click", () => GAMES.anagram.next());
      $("#ans").focus();
    }
  },
  syn: {
    start() { shell("Synonyms Match"); this.next(); },
    next() {
      const w = pickWord(x => x.syn.length), e = SEED[w];
      const answer = pick(e.syn);
      mcq({ label: "Choose the synonym of", question: "<b>" + esc(w) + "</b>", answer,
        options: shuffle([answer].concat(distractors(e.syn.concat(e.ant, [w]), 3))),
        hint: "", next: () => GAMES.syn.next() });
    }
  },
  ant: {
    start() { shell("Antonyms Challenge"); this.next(); },
    next() {
      const w = pickWord(x => x.ant.length), e = SEED[w];
      const answer = pick(e.ant);
      mcq({ label: "Choose the antonym of", question: "<b>" + esc(w) + "</b>", answer,
        options: shuffle([answer].concat(distractors(e.syn.concat(e.ant, [w]), 3))),
        hint: "", next: () => GAMES.ant.next() });
    }
  },
  fill: {
    start() { shell("Fill in the Blanks"); this.next(); },
    next() {
      const w = pickWord(() => true), e = SEED[w];
      const ex = e.meanings[0].defs[0].e;
      const re = new RegExp("\\b" + w + "\\b", "i");
      const sentence = ex.replace(re, "_____");
      mcq({ label: "Choose the word that completes the sentence", question: esc(sentence), answer: w,
        options: shuffle([w].concat(shuffle(WORDS.filter(x => x !== w)).slice(0, 3))),
        hint: "Meaning: " + e.meanings[0].defs[0].d, next: () => GAMES.fill.next() });
    }
  }
};
</script>
